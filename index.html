<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScanPass Pro">
  <meta name="description" content="Escáner ultra rápido y ligero de códigos QR y códigos de barras">
  <title>ScanPass Pro</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Manifest JSON Inlined using Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"ScanPass Pro","short_name":"ScanPass","start_url":".","display":"standalone","background_color":"#090d16","theme_color":"#090d16","icons":[{"src":"https://img.icons8.com/isometric-line/192/qr-code.png","sizes":"192x192","type":"image/png"},{"src":"https://img.icons8.com/isometric-line/512/qr-code.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Lightweight QR/Barcode Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: rgba(18, 26, 43, 0.7);
      --border-card: rgba(255, 255, 255, 0.12);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #997a15 100%);
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(16px);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.07) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem;
      overflow-x: hidden;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 0.75rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      stroke: #070a12;
      stroke-width: 2.2;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* PWA Install Button */
    .pwa-install-btn {
      display: none;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-primary);
      color: #f3e5ab;
      padding: 0.4rem 0.75rem;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pwa-install-btn:active {
      transform: scale(0.95);
      background: var(--gold-primary);
      color: #000;
    }

    /* Scanner viewport container */
    .scanner-wrapper {
      width: 100%;
      max-width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .camera-card {
      width: 100%;
      aspect-ratio: 1/1;
      background: rgba(11, 16, 28, 0.85);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
      border-radius: 28px;
    }

    /* HUD Reticle Overlay */
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hud-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: var(--gold-primary);
      border-style: solid;
      border-width: 0;
    }

    .hud-tl { top: 24px; left: 24px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 12px; }
    .hud-tr { top: 24px; right: 24px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 12px; }
    .hud-bl { bottom: 24px; left: 24px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 12px; }
    .hud-br { bottom: 24px; right: 24px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 12px; }

    /* Scanning Laser Line */
    .laser-line {
      position: absolute;
      width: 82%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), var(--accent-cyan), var(--gold-primary), transparent);
      box-shadow: 0 0 15px var(--gold-primary);
      top: 20%;
      display: none;
      animation: laserMove 2s infinite ease-in-out;
      z-index: 6;
    }

    @keyframes laserMove {
      0% { top: 20%; opacity: 0.3; }
      50% { top: 80%; opacity: 1; }
      100% { top: 20%; opacity: 0.3; }
    }

    /* Camera Placeholder state */
    .camera-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1.5rem;
    }

    .camera-idle svg {
      width: 48px;
      height: 48px;
      stroke: var(--gold-primary);
      opacity: 0.85;
    }

    /* Control Panel */
    .controls-container {
      width: 100%;
      max-width: 380px;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-main {
      width: 100%;
      padding: 1.1rem;
      background: var(--gold-gradient);
      color: #070a12;
      font-weight: 700;
      font-family: var(--font-heading);
      font-size: 1.05rem;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-main:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
      display: none;
    }

    .secondary-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-sub {
      flex: 1;
      padding: 0.75rem;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.2s;
    }

    .btn-sub:active {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Modal Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 15, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 100;
      animation: fadeIn 0.22s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--gold-primary);
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-green);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .code-box {
      background: #070a12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.85rem;
      border-radius: 14px;
      font-size: 0.82rem;
      color: var(--accent-cyan);
      word-break: break-all;
      margin: 1rem 0;
      max-height: 110px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
    }

    .btn-action-go {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      text-decoration: none;
      font-weight: 700;
      border-radius: 14px;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
      margin-bottom: 0.5rem;
      border: none;
      cursor: pointer;
    }

    .btn-action-copy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 700;
      border-radius: 14px;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }

    /* History Bottom Sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      z-index: 90;
    }

    .sheet-card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #0d1322;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid var(--border-card);
      padding: 1.5rem;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.28s cubic-bezier(0, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .sheet-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .history-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .history-item {
      background: #070a12;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 0.85rem;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-code {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      word-break: break-all;
      font-family: monospace;
    }

    .history-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 20px;
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      z-index: 120;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    footer {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="7" y="7" width="10" height="10" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">ScanPass Pro</div>
        <div class="brand-sub">Lectura Rápida</div>
      </div>
    </div>
    <button id="pwa-install" class="pwa-install-btn" onclick="installPWA()">
      📲 Instalar App
    </button>
  </header>

  <main class="scanner-wrapper">
    <div class="camera-card">
      <div id="reader"></div>
      
      <!-- Static Reticle HUD Frame -->
      <div class="hud-overlay">
        <div class="hud-corner hud-tl"></div>
        <div class="hud-corner hud-tr"></div>
        <div class="hud-corner hud-bl"></div>
        <div class="hud-corner hud-br"></div>
        <div id="laser" class="laser-line"></div>
        
        <div id="camera-idle-state" class="camera-idle">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
          </svg>
          <span style="font-size:0.85rem; font-weight:600;">Cámara Lista</span>
          <span style="font-size:0.75rem; opacity:0.7;">Toca 'Iniciar Escaneo' abajo</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
      <button id="btn-start" class="btn-main" onclick="startScanner()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Iniciar Escaneo
      </button>

      <button id="btn-stop" class="btn-main btn-stop" onclick="stopScanner()">
        Detener Cámara
      </button>

      <div class="secondary-actions">
        <button id="btn-torch" class="btn-sub" onclick="toggleTorch()" style="display:none;">
          💡 Flash
        </button>
        <button id="btn-camera-flip" class="btn-sub" onclick="switchCamera()" style="display:none;">
          🔄 Cambiar
        </button>
        <button class="btn-sub" onclick="openHistory()">
          📋 Historial (<span id="history-count">0</span>)
        </button>
      </div>
    </div>
  </main>

  <!-- Result Modal -->
  <div id="result-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        CÓDIGO DETECTADO
      </div>
      <h2 class="modal-title">Lectura Exitosa</h2>
      
      <div id="qr-code-box" class="code-box">---</div>

      <a id="qr-open-link" class="btn-action-go" href="#" target="_blank" onclick="closeResultModal()">
        🌐 Abrir Enlace
      </a>

      <button class="btn-action-copy" onclick="copyCodeText()">
        📋 Copiar Datos / Folio
      </button>

      <button class="btn-sub" style="width:100%; margin-top:0.25rem;" onclick="closeResultModal(); startScanner();">
        Escanear Otro Código
      </button>
    </div>
  </div>

  <!-- History Sheet -->
  <div id="history-sheet" class="sheet-backdrop" onclick="closeHistory(event)">
    <div class="sheet-card" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <span class="sheet-title">Lecturas Recientes</span>
        <button class="btn-sub" style="padding:0.4rem 0.8rem;" onclick="clearHistory()">Limpiar</button>
      </div>
      <div id="history-list" class="history-list">
        <!-- Dynamic history elements -->
      </div>
      <button class="btn-sub" style="margin-top:1rem; width:100%;" onclick="closeHistory()">Cerrar</button>
    </div>
  </div>

  <div id="toast">Copiado al portapapeles</div>

  <footer>
    Optimizado para dispositivos móviles
  </footer>

  <script>
    /* Service Worker Registration using Inline Blob for PWA support */
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    /* PWA Installation Event Listener */
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install').style.display = 'block';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('pwa-install').style.display = 'none';
        });
      }
    }

    /* Application Logic */
    let html5QrCode = null;
    let isScanning = false;
    let isTorchOn = false;
    let currentCameraFacing = "environment";
    let lastScannedText = "";
    let historyData = JSON.parse(localStorage.getItem('scanpass_history') || '[]');

    updateHistoryCount();

    /* Web Audio API Beep Generator */
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch notification
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function startScanner() {
      if (isScanning) return;

      document.getElementById('camera-idle-state').style.display = 'none';
      document.getElementById('laser').style.display = 'block';
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'flex';

      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 12, // Low FPS to save CPU and RAM
        qrbox: { width: 230, height: 230 },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: currentCameraFacing },
        config,
        onScanSuccess
      ).then(() => {
        isScanning = true;
        document.getElementById('btn-camera-flip').style.display = 'flex';
        try {
          const capabilities = html5QrCode.getRunningTrackCapabilities();
          if (capabilities.torch) {
            document.getElementById('btn-torch').style.display = 'flex';
          }
        } catch(e) {}
      }).catch(err => {
        alert("No se pudo iniciar la cámara. Revisa los permisos en tu navegador.");
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          resetScannerUI();
        }).catch(() => {
          resetScannerUI();
        });
      } else {
        resetScannerUI();
      }
    }

    function resetScannerUI() {
      isScanning = false;
      isTorchOn = false;
      document.getElementById('camera-idle-state').style.display = 'flex';
      document.getElementById('laser').style.display = 'none';
      document.getElementById('btn-start').style.display = 'flex';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('btn-torch').style.display = 'none';
      document.getElementById('btn-camera-flip').style.display = 'none';
    }

    function toggleTorch() {
      if (html5QrCode && isScanning) {
        isTorchOn = !isTorchOn;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: isTorchOn }]
        });
      }
    }

    function switchCamera() {
      currentCameraFacing = (currentCameraFacing === "environment") ? "user" : "environment";
      if (isScanning) {
        stopScanner();
        setTimeout(() => startScanner(), 300);
      }
    }

    function onScanSuccess(decodedText) {
      // Audio & Vibration Feedback
      playBeep();
      if (navigator.vibrate) navigator.vibrate([80, 30, 80]);

      lastScannedText = decodedText;

      // Stop scanner immediately to save RAM
      stopScanner();

      // Save to history
      saveToHistory(decodedText);

      // Display Modal with options
      document.getElementById('qr-code-box').innerText = decodedText;
      const openBtn = document.getElementById('qr-open-link');

      // Check if text is a valid web link
      if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
        openBtn.href = decodedText;
        openBtn.style.display = 'flex';
      } else {
        openBtn.style.display = 'none';
      }

      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeResultModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function copyCodeText() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastScannedText).then(showToast);
      } else {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = lastScannedText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      }
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2000);
    }

    /* History Management */
    function saveToHistory(text) {
      const item = {
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      historyData.unshift(item);
      if (historyData.length > 10) historyData.pop(); // Limit to 10 entries for max performance
      localStorage.setItem('scanpass_history', JSON.stringify(historyData));
      updateHistoryCount();
    }

    function updateHistoryCount() {
      document.getElementById('history-count').innerText = historyData.length;
    }

    function openHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (historyData.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:1rem; font-size:0.85rem;">Historial vacío</div>';
      } else {
        historyData.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          const isUrl = item.text.startsWith('http://') || item.text.startsWith('https://');
          
          div.innerHTML = `
            <div>
              <div class="history-code">${item.text}</div>
              <div class="history-time">${item.time}</div>
            </div>
            ${isUrl ? `<a href="${item.text}" target="_blank" class="btn-sub" style="padding:0.4rem 0.6rem; text-decoration:none;">Abrir</a>` : ''}
          `;
          container.appendChild(div);
        });
      }

      document.getElementById('history-sheet').style.display = 'flex';
    }

    function closeHistory(e) {
      if (!e || e.target.id === 'history-sheet') {
        document.getElementById('history-sheet').style.display = 'none';
      }
    }

    function clearHistory() {
      historyData = [];
      localStorage.removeItem('scanpass_history');
      updateHistoryCount();
      openHistory();
    }
  </script>
</body>
</html>
